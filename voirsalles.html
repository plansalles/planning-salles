    <script>
	var calendar;
    document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');

    calendar = new FullCalendar.Calendar(calendarEl, {
	  
	  schedulerLicenseKey: 'GPL-My-Project-Is-Open-Source',
	  locale: 'fr',
      height: '800',
      slotMinTime: '06:00:00',
      slotMaxTime: '22:00:00',
	  themeSystem: 'bootstrap',
	  allDaySlot: false,
      // slotDuration: '00:15:00',
	  
	  views: {
    	month: { titleFormat: { year: 'numeric', month: 'long' }},
		week: { titleFormat: { year: 'numeric', month: 'long',day: 'numeric'}},
		day: { titleFormat: { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'}}
		    	
      },

       
	  navLinks: true,
     // slotLabelInterval: '00:30:00',
	 eventOverlap: false,
      editable: false, // enable draggable events
      selectable: true,
      aspectRatio: 1.8,
      resourceAreaWidth: '15%',
	  customButtons: {
          myCustomButton1: {
			text: 'Semaine',
          click: function () {//alert('Vous allez changer un truc' );
	calendar.setOption('height', 400);
	calendar.changeView('dayGridWeek');}
                    
                         },
		  myCustomButton2: {
          text: 'vue ligne',
          click: function () {//alert('Vous allez changer un truc' );
	calendar.setOption('height', 250);
	calendar.changeView('resourceTimelineDay');}
                    
                         },
		 myCustomButton3: {
          text: 'vue outlook',
          click: function () {//alert('Vous allez changer un truc' );
	calendar.setOption('height', 800);
	calendar.changeView('resourceTimeGridDay');}
                    
                         },
						 myCustomButton4: {
          text: 'Mois',
          click: function () {//alert('Vous allez changer un truc' );
	calendar.setOption('height', 800);
	calendar.changeView('dayGridMonth');}
                    
                         }
      },
      headerToolbar: {
        left: 'today prev,next',
        center: 'title',
        right: 'myCustomButton2 myCustomButton3 myCustomButton1 myCustomButton4'
      },
      //initialView: 'resourceTimelineDay',
	  initialView: 'resourceTimeGridDay',
	
	  eventResize: function(info) { 
		
	 
	},
	 
	  select: function(info) { 
	 
	 },
	  dateClick: function(info) {     //ce qui se passe quand on clique sur une date
		
		viderForm();
		   
		var dktl = new Date (info.date);
				 //alert('dateclick ');

        if (dktl.getHours() == 0){       //heure = 0 cad on a cliqué sur le jour du mois/semaine donc on va sur ce jour la
            calendar.setOption('height', 800);
		    calendar.changeView('resourceTimeGridDay');
		    calendar.gotoDate( info.date );
        }
        else {  // on a cliqué sur une des heures du jour donc on ouvre fenetre pour encoder reservation e
            
           
        }  
	   
      },

	  navLinkDayClick: function(date,jevent) { // lorsque l'on clique sur numéro du jour dans calendrier -> go ce jour la
		
		calendar.setOption('height', 800);
		calendar.changeView('resourceTimeGridDay');
		calendar.gotoDate( date );

	  },
	  eventDrop: function(info) {
		
    
  },
	  
	  eventClick: function(info) {
		
		if(info.event.extendedProps.serrecep < 99)
		{
		
		var id = info.event.id;
		
		viderForm();
        //alert('date creation: ' + info.event.start);
		var d = new Date (info.event.start);
		var f = new Date (info.event.end);
		jour=d.getDate();
		if(jour < 10)
          jour = "0" + jour;
		mois = d.getMonth()+1;
		if(mois< 10)
          mois = "0" + mois;


	    var dateEvent = jour+'/'+mois+'/'+d.getFullYear();
		//alert('date debut: ' + dateEvent);
		var minutes = d.getMinutes();
		if(minutes < 10)
          minutes = "0" + minutes;
		
		var debut = d.getHours()+' '+minutes;

		var minutes = f.getMinutes();
		if(minutes < 10)
          minutes = "0" + minutes;
		
		var fin = f.getHours()+' '+minutes;
		var salleId = info.event.getResources()[0].id;
	
		document.getElementById("creationModalTitre").innerHTML = "Visualiser une réunion";
		$('#persId').val(1);
		$('#creationModal').modal('show');
		$('#eventId').attr('value', info.event.id);
		$('#sequence').attr('value', info.event.extendedProps.sequence);
		$('#titleEvent').val(info.event.title);
		$('#salle').val(salleId);
		$('#startDate').attr('value', debut);
		$('#endDate').attr('value', fin);
		$('#datepicker').attr('value', dateEvent);
		
		$('#areadescription').val(info.event.extendedProps.description);
		
		if (info.event.extendedProps.serrecep == 1) {
             $( "#ckserrecep" ).prop( "checked", true );
			//alert('serrecep : ' + info.event.extendedProps.serrecep + "serinf : " + info.event.extendedProps.serinf); 
        }
		else
		{ $( "#ckserrecep" ).prop( "checked", false); }

		if (info.event.extendedProps.serinf == 1)
		{ 
			//alert('serrecep : ' + info.event.extendedProps.serrecep + "serinf : " + info.event.extendedProps.serinf);
			$( "#ckserinfo" ).prop( "checked", true ); }
		else
		{ $( "#ckserinfo" ).prop( "checked", false); }


		
		
		
		
		
		
        $('#creationModal').modal('show'); 
	}
	else
	{
	
	}
  },

      
      resourceAreaHeaderContent: 'Salles',
      resources: [
        { id: '1', title: 'Salle du conseil' },
        { id: '2', title: 'Salle 19' },
        { id: '4', title: 'Salle 2' },
		{ id: '5', title: 'Warneton Conseil' },
		{ id: '6', title: 'Warneton Expo' },
		{ id: '7', title: 'Ploegsteert' },
        
     
      ],
      events: 'test.json',
	  
      
    });

    calendar.render();
  });

</script>

<script>
function viderForm() {
	
//	alert('Vous allez viderformter un truc !!!' );

		  	
		$('#eventId').removeAttr('value');
		//alert ('#title event vaut'+ $('#titleEvent').val());
		
		$('#titleEvent').val("");
		//alert ('#title event vaut maintenant '+ $('#titleEvent').val());
		//$('#titleEvent').attr('value', '');

		
		//$('#salle')[salleId].selected = true;
		$('#startDate').removeAttr('value');
		$('#endDate').removeAttr('value');
		$('#datepicker').removeAttr('value');
		$("#ckserrecep" ).prop("checked", false);
	    $("#ckserinfo" ).prop("checked", false);
		$('#areadescription').val("");
	
}
</script>
